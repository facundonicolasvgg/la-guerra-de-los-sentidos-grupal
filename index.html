<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>La Guerra de los Sentidos - Evolutivo</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{--bg:#0b0612;--card-bg:#160f24;--accent:#ff2a5f;--accent-sub:#9d1df2;--text:#ffffff;--text-muted:#a59ba3;}body{margin:0;padding:20px;background:radial-gradient(circle at top, #1a0b2e, var(--bg));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box;}header{text-align:center;margin-bottom:15px;}h1{margin:0;font-size:1.8rem;background:linear-gradient(45deg,var(--accent),var(--accent-sub));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}header p{margin:5px 0 0 0;color:var(--text-muted);font-size:0.85rem;font-style:italic;}.container{width:100%;max-width:440px;display:flex;flex-direction:column;gap:15px;}h3{margin:0 0 10px 0;}.setup-section{background:var(--card-bg);padding:20px;border-radius:20px;border:1px solid #2d1b4e;box-shadow:0 10px 30px rgba(0,0,0,0.5);}.player-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}.input-field{padding:12px;border-radius:10px;border:1px solid #443266;background:#201435;color:white;font-size:1rem;flex:1;box-sizing:border-box;}.select-sex{padding:12px;border-radius:10px;border:1px solid #443266;background:#201435;color:white;font-size:1rem;cursor:pointer;}.btn{padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(255,42,95,0.3);width:100%;box-sizing:border-box;margin-top:5px;}.btn-secondary{background:#3b2366;box-shadow:none;margin-bottom:10px;}.btn-climax{background:linear-gradient(45deg, #cc0000, #660022);border:1px solid #ff0055;margin-top:10px;display:none;}#gameArea{display:none;flex-direction:column;gap:15px;width:100%;}.turn-indicator{text-align:center;font-size:1.1rem;font-weight:bold;color:#ffde59;margin-bottom:5px;}.mode-badge{text-align:center;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;background:rgba(157,29,242,0.3);padding:4px 10px;border-radius:20px;color:#dfbaff;align-self:center;margin-bottom:5px;border:1px solid rgba(157,29,242,0.5);}.game-card{width:100%;background:#201633;border:2px solid var(--accent);border-radius:20px;padding:25px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:0 8px 25px rgba(0,0,0,0.6);}.card-instruction{font-size:1.15rem;line-height:1.5;color:#e2d9f3;margin-bottom:15px;font-weight:500;}.card-consequence{background:rgba(255,42,95,0.1);border:1px dashed var(--accent);padding:12px;border-radius:8px;font-size:0.9rem;color:#ff7ea0;margin-top:10px;line-height:1.4;}.secret-area{background:#110a1c;border:1px solid var(--accent-sub);border-radius:12px;padding:15px;margin-top:10px;display:flex;flex-direction:column;gap:10px;}</style></head><body><header><h1>La Guerra de los Sentidos</h1><p>Edición Progresiva Inteligente</p></header><div class="container"><div class="setup-section" id="setupSection"><h3>Participantes</h3><div id="playersContainer"></div><button class="btn btn-secondary" id="addPlayerBtn">+ Añadir Jugador/a</button><button class="btn" id="startBtn">Comenzar Juego</button></div><div id="gameArea"><div class="mode-badge" id="modeBadge">Modo detectado</div><div class="turn-indicator" id="turnIndicator">Turno de...</div><div class="game-card"><div class="card-instruction" id="cardInstruction">Cargando...</div><div id="secretContainer"></div><div class="card-consequence" id="cardConsequence">Penitencia...</div></div><button class="btn" id="nextCardBtn">Siguiente Tarjeta</button><button class="btn btn-climax" id="climaxBtn">Alguien se ha quedado desnudo</button></div></div><script>let players=[];let currentTurn=0;let cardCount=1;let climaxStage=0; // 0=Normal, 1=Caliente (Crescendo Max), 2=Sexual total
let gameMode="grupo";let usedCards=[];let secretChoices={};let dynamicMatches=[];let playersPromptedSecret=[];

// POOL NORMAL: Dividido estrictamente por niveles para cumplir el "Crescendo"
const poolNormal={
suave:[
"{P1} debe mirar fijamente a los ojos de {P2} durante 30 segundos sin reírse ni parpadear. El primero que falle pierde.",
"{P1} debe darle un masaje de un minuto en los hombros a {P2} utilizando únicamente sus manos de forma relajante.",
"{P2} cierra los ojos. {P1} tarareará una canción muy cerca de su oído y {P2} debe adivinar de qué tema se trata.",
"{P1} tiene que hacerle un cumplido sincero e ingenioso a {P2} utilizando palabras que empiecen por la letra 'S'.",
"Votación psicológica: A la de tres, todos apuntan a la persona que consideren más tímida del grupo. El elegido cuenta un secreto inocente."
],
medio:[
"{P1} debe vendarle los ojos a {P2}. {P3} le dará un beso suave en la mejilla o el cuello. {P2} debe adivinar quién ha sido.",
"{P1} tiene que susurrarle al oído a {P2} qué es lo que más le llama la atención de su físico hoy, de forma lenta y pausada.",
"{P2} cierra los ojos. {P1} usará la yema de su dedo para escribir una palabra en la espalda de {P2}. Si la adivina, se salva.",
"{P1} y {P2} se dan un abrazo muy apretado manteniendo el contacto corporal completo durante 45 segundos en silencio.",
"{P2} debe permitir que {P1} le haga cosquillas en las costillas o los pies durante 15 segundos sin intentar apartar las manos."
],
alto:[
"{P1} debe rozar sutilmente con sus labios el lóbulo de la oreja de {P2} y decirle algo sugerente en voz muy baja.",
"{P1} tiene que confesar ante el grupo cuál es su mayor fantasía erótica para cumplir a corto plazo.",
"{P2} se tumba boca arriba. {P1} debe guiar suavemente las manos de {P3} hacia una zona del torso de {P2} con los ojos cerrados.",
"{P1} debe desbloquear su móvil y dejar que {P2} revise su última conversación de chat abierta durante 15 segundos.",
"Reto cruzado: {P1} debe acercarse a {P2} y confesarle al oído qué prenda de ropa le quitaría en primer lugar si estuvieran solos."
]};

// POOL CALIENTE (Fase 1 del Botón Especial: Potenciadas y en crescendo máximo)
const poolCaliente={
trio:[
"{P1} debe morder suavemente el cuello de {P2} mientras {P3} le acaricia los muslos por encima o debajo de la ropa.",
"Contacto triple: {P2} se coloca en medio de {P1} y {P3}. Ambos deben besar simultáneamente sus mejillas y bajar hacia el cuello.",
"{P1} tiene el poder de elegir qué prenda se quita {P2} o {P3} ahora mismo, sin opción a réplica.",
"{P3} se tumba y permite que {P1} y {P2} recorran sus brazos y torso usando únicamente caricias lentas con la punta de los dedos."
],
parejas:[
"Tensión cruzada: {P1} debe sentarse en el regazo de {P2} cara a cara durante los próximos dos turnos enteros del juego.",
"{P2} tiene que darle un beso de 10 segundos a {P1} en la zona de la piel expuesta que {P1} elija (excepto la cara).",
"{P1} va a elegir a {P2} para realizar un baile sensual cuerpo a cuerpo de 30 segundos sin música.",
"{P2} debe guiar las manos de {P1} por debajo de su camiseta para que acaricie su espalda o abdomen desnudo."
],
grupo:[
"El Dictador: {P1} toma el control y ordena a dos personas de la habitación que compartan un beso apasionado de 5 segundos.",
"Efecto térmico: {P1} debe pasar un hielo o un objeto frío por el abdomen o cuello de la persona que tenga a su izquierda.",
"Votación de prendas: Todos apuntan a la de tres a quien consideren que debería quedarse completamente desnudo ya. El más votado se quita una prenda.",
"Masaje en cadena avanzado: Todos en fila sin camiseta (los que puedan). Masaje intenso de espalda y hombros durante un minuto."
]};

// POOL SEXUAL (Fase 2 del Botón Especial: Posiciones finales por afinidad)
const poolSexual={
trio:[
"¡EL VÉRTICE DEL TRÍO! La persona que inició el juego o se desnudó primero se coloca en el centro. Los otros dos se colocan a sus lados para caricias y besos simultáneos.",
"¡MISIONERO CON ASISTENCIA! Dos de los participantes inician la postura del Misionero Clásico en la cama. El tercero se coloca al lado guiando el ritmo y acariciando libremente.",
"¡ESTILO PERRO COMPARTIDO! Una persona se coloca a cuatro patas en el centro. La segunda se posiciona detrás marcando el ritmo, mientras el restante se funde en besos delante.",
"¡CONEXIÓN LIBRE DE TRES! Habéis alcanzado el clímax. Distribuid los roles de forma cómoda y disfrutad del placer compartido sin restricciones."
],
parejas:[
"¡DIVISIÓN DE PAREJAS POR AFINIDAD! El juego os reconduce de forma definitiva. {MATCH_TEXT} Tomad vuestros espacios independientes en la cama.",
"¡ESTILO DOS Y DOS! Cada pareja recién formada inicia la postura del Misionero en su lado. Se permite mantener el contacto visual con la otra pareja.",
"¡RITMO SINCRONIZADO! Ambas parejas adoptan la postura de Estilo Perro V1 en paralelo. Coordinad el ritmo de movimientos de forma visual.",
"¡CLÍMAX DOBLE LIBRE! El objetivo se ha cumplido: dos parejas independientes disfrutando al mismo tiempo. Continuad a vuestro propio ritmo."
],
grupo:[
"¡INICIO DE LA ORGÍA POR AFINIDAD! Se rompen las barreras. El juego detecta estas atracciones mutuas: {MATCH_TEXT}. Los cuerpos se agrupan en el centro para contacto libre.",
"¡SATELLITE COMPARTIDO! Se forman focos de acción en la habitación. Buscad grupos de dos o tres personas cercanas y cambiad de compañero cuando os apetezca.",
"¡FUSIÓN DE SENTIDOS! El juego libre queda inaugurado. Dejáos llevar por el contacto colectivo y disfrutad sin turnos."
]};

window.onload=function(){for(let i=1;i<=3;i++) addPlayerRow();}
document.getElementById('addPlayerBtn').addEventListener('click', addPlayerRow);

function addPlayerRow(){const container=document.getElementById('playersContainer');const count=container.children.length+1;const row=document.createElement('div');row.className='player-row';row.innerHTML=`<input type="text" class="input-field p-name" placeholder="Jugador/a ${count}"><select class="select-sex p-sex"><option value="H">M ♂️</option><option value="M">F ♀️</option></select>`;container.appendChild(row);}

document.getElementById('startBtn').addEventListener('click',()=>{players=[];const names=document.getElementsByClassName('p-name');const sexes=document.getElementsByClassName('p-sex');for(let i=0;i<names.length;i++){let n=names[i].value.trim();if(n){players.push({id: i, name:n, sex:sexes[i].value});}}if(players.length<3){alert("Introduce al menos 3 participantes.");return;}detectMode();document.getElementById('setupSection').style.display='none';document.getElementById('gameArea').style.display='flex';getCard();});

function detectMode(){const hombres=players.filter(p=>p.sex==='H').length;const mujeres=players.filter(p=>p.sex==='M').length;const total=players.length;if(total===3){gameMode="trio";document.getElementById('modeBadge').textContent="Guion: Trío Sincronizado";}else if(total===4 && hombres===2 && mujeres===2){gameMode="parejas";document.getElementById('modeBadge').textContent="Guion: Doble Pareja (2 y 2)";}else{gameMode="grupo";document.getElementById('modeBadge').textContent="Guion: Orgía / Caos Grupal";}}

function getCard(){document.getElementById('secretContainer').innerHTML="";let rawText="";const activePlayer=players[currentTurn];// La pregunta secreta salta de forma orgánica en rondas intermedias (no al principio)
if(climaxStage===0 && cardCount > 3 && !playersPromptedSecret.includes(activePlayer.id) && playersPromptedSecret.length < players.length){generateSecretPromptStep1(activePlayer);return;}if(climaxStage===0){let poolTier=poolNormal.suave;if(cardCount>6) poolTier=poolNormal.medio;if(cardCount>12) poolTier=poolNormal.alto;if(usedCards.length===poolTier.length) usedCards=[];let idx;do{idx=Math.floor(Math.random()*poolTier.length);}while(usedCards.includes(idx));usedCards.push(idx);rawText=poolTier[idx];}else if(climaxStage===1){let poolTier=poolCaliente[gameMode];if(usedCards.length===poolTier.length) usedCards=[];let idx;do{idx=Math.floor(Math.random()*poolTier.length);}while(usedCards.includes(idx));usedCards.push(idx);rawText=poolTier[idx];}else{let idx=cardCount;let poolTier=poolSexual[gameMode];if(idx>=poolTier.length) idx=poolTier.length-1;rawText=poolTier[idx];}let shuffled=players.filter(p=>p.id!==activePlayer.id).sort(()=>0.5-Math.random());const p1=activePlayer.name;const p2=shuffled[0]?shuffled[0].name:"";const p3=shuffled[1]?shuffled[1].name:"";let finalInstruction=rawText.replace(/{P1}/g,p1).replace(/{P2}/g,p2).replace(/{P3}/g,p3);if(climaxStage===2){let matchText="¡Libertad total de emparejamiento!";if(dynamicMatches.length>0){matchText=dynamicMatches.map(m=>`<strong>${m[0]} y ${m[1]}</strong>`).join(" | ");}finalInstruction=finalInstruction.replace(/{MATCH_TEXT}/g,matchText);}document.getElementById('cardInstruction').innerHTML=finalInstruction;document.getElementById('turnIndicator').textContent=`Turno de: ${activePlayer.name}`;const consQ=document.getElementById('cardConsequence');if(climaxStage===0){consQ.innerHTML=`<strong>PENITENCIA:</strong> Si ${activePlayer.name} falla el reto, se quita una prenda de ropa.`;}else if(climaxStage===1){consQ.innerHTML=`<strong>PENITENCIA POTENCIADA:</strong> Si se falla el reto, se quitan DOS prendas de golpe.`;}else{consQ.innerHTML=`<strong>FASE SEXUAL:</strong> Disfrutad de la interacción libre y las posturas sugeridas.`;}}

// PREGUNTA SECRETA - PASO 1: Pantalla ciega de entrega
function generateSecretPromptStep1(player){document.getElementById('turnIndicator').textContent=`Turno Especial`;document.getElementById('cardInstruction').innerHTML=`<div style='text-align:center; padding:10px;'>🔒 <strong>SISTEMA DE ASIGNACIÓN SECRETA</strong><br><br><span style='font-size:1.3rem; color:#ffde59;'>Pasa el teléfono móvil a: <br><strong>${player.name}</strong></span><br><br><small style='color:var(--text-muted);'>Los demás jugadores deben apartar la mirada para mantener el secreto.</small></div>`;const container=document.getElementById('secretContainer');container.innerHTML=`<button class="btn" id="revealSecretBtn" style="background:var(--accent-sub); margin-top:15px;">Soy ${player.name}, abrir pregunta</button>`;document.getElementById('revealSecretBtn').addEventListener('click',()=>{generateSecretPromptStep2(player);});}

// PREGUNTA SECRETA - PASO 2: Votación real oculta
function generateSecretPromptStep2(player){playersPromptedSecret.push(player.id);document.getElementById('cardInstruction').innerHTML=`🔒 <strong>PREGUNTA SECRETA</strong><br><small style='color:#ff7ea0;'>Nadie sabrá qué vas a responder.</small>`;const container=document.getElementById('secretContainer');const options=players.filter(p=>p.id!==player.id).map(p=>`<option value="${player.id}-${p.id}">${p.name}</option>`).join("");container.innerHTML=`<div class="secret-area"><label style="font-size:0.95rem;color:#dfbaff;">Si tuvieras que elegir a una persona de esta habitación para terminar teniendo sexo esta noche, ¿quién sería?</label><select id="secretSelect" class="select-sex" style="width:100%; margin-top:5px;">${options}</select><button class="btn" id="saveSecretBtn" style="background:var(--accent);">Confirmar Selección</button></div>`;document.getElementById('saveSecretBtn').addEventListener('click',()=>{const select=document.getElementById('secretSelect').value;const [fromId, toId]=select.split("-");secretChoices[fromId]=toId;checkMatches();container.innerHTML=`<p style="color:#00ff88; font-weight:bold; text-align:center;">Guardado. Pasa el móvil de vuelta.</p>`;setTimeout(()=>{getCard();},1500);});}

function checkMatches(){dynamicMatches=[];let checked=[];for(let fromId in secretChoices){let toId=secretChoices[fromId];if(secretChoices[toId]===fromId && !checked.includes(fromId)){const p1=players.find(p=>p.id==parseInt(fromId)).name;const p2=players.find(p=>p.id==parseInt(toId)).name;dynamicMatches.push([p1,p2]);checked.push(fromId);checked.push(toId);}}}document.getElementById('nextCardBtn').addEventListener('click',()=>{cardCount++;currentTurn=(currentTurn+1)%players.length;if(cardCount>=3 && climaxStage===0){document.getElementById('climaxBtn').style.display='block';}getCard();});

// Gestión inteligente del botón especial por fases
document.getElementById('climaxBtn').addEventListener('click',()=>{if(climaxStage===0){climaxStage=1;cardCount=0;usedCards=[];document.getElementById('modeBadge').textContent="Fase: Crescendo Máximo 🔥";document.getElementById('climaxBtn').textContent="Otra persona se ha quedado desnuda";document.getElementById('climaxBtn').style.background="linear-gradient(45deg, #cc0000, #110000)";getCard();}else if(climaxStage===1){climaxStage=2;cardCount=0;document.getElementById('modeBadge').textContent="Fase: Acción Sexual 🔞";document.getElementById('climaxBtn').style.display='none';getCard();}});</script></body></html>
