<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>La Guerra de los Sentidos - Grupal Pro</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{--bg:#0b0612;--card-bg:#160f24;--accent:#ff2a5f;--accent-sub:#9d1df2;--text:#ffffff;--text-muted:#a59ba3;}body{margin:0;padding:20px;background:radial-gradient(circle at top, #1a0b2e, var(--bg));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box;}header{text-align:center;margin-bottom:15px;}h1{margin:0;font-size:1.8rem;background:linear-gradient(45deg,var(--accent),var(--accent-sub));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}header p{margin:5px 0 0 0;color:var(--text-muted);font-size:0.85rem;font-style:italic;}.container{width:100%;max-width:440px;display:flex;flex-direction:column;gap:15px;}h3{margin:0 0 10px 0;}.setup-section{background:var(--card-bg);padding:20px;border-radius:20px;border:1px solid #2d1b4e;box-shadow:0 10px 30px rgba(0,0,0,0.5);}.player-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}.input-field{padding:12px;border-radius:10px;border:1px solid #443266;background:#201435;color:white;font-size:1rem;flex:1;box-sizing:border-box;}.select-sex{padding:12px;border-radius:10px;border:1px solid #443266;background:#201435;color:white;font-size:1rem;cursor:pointer;}.btn{padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(255,42,95,0.3);width:100%;box-sizing:border-box;margin-top:5px;}.btn-secondary{background:#3b2366;box-shadow:none;margin-bottom:10px;}.btn-climax{background:linear-gradient(45deg, #cc0000, #660022);border:1px solid #ff0055;margin-top:10px;display:none;}#gameArea{display:none;flex-direction:column;gap:15px;width:100%;}.turn-indicator{text-align:center;font-size:1.1rem;font-weight:bold;color:#ffde59;margin-bottom:5px;}.mode-badge{text-align:center;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;background:rgba(157,29,242,0.3);padding:4px 10px;border-radius:20px;color:#dfbaff;align-self:center;margin-bottom:5px;border:1px solid rgba(157,29,242,0.5);}.game-card{width:100%;background:#201633;border:2px solid var(--accent);border-radius:20px;padding:25px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:0 8px 25px rgba(0,0,0,0.6);}.card-instruction{font-size:1.15rem;line-height:1.5;color:#e2d9f3;margin-bottom:15px;font-weight:500;}.card-consequence{background:rgba(255,42,95,0.1);border:1px dashed var(--accent);padding:12px;border-radius:8px;font-size:0.9rem;color:#ff7ea0;margin-top:10px;line-height:1.4;}.secret-area{background:#110a1c;border:1px solid var(--accent-sub);border-radius:12px;padding:15px;margin-top:10px;display:flex;flex-direction:column;gap:10px;}</style></head><body><header><h1>La Guerra de los Sentidos</h1><p>Edición Inteligente Multijugador</p></header><div class="container"><div class="setup-section" id="setupSection"><h3>Participantes</h3><div id="playersContainer"></div><button class="btn btn-secondary" id="addPlayerBtn">+ Añadir Jugador/a</button><button class="btn" id="startBtn">Comenzar Juego</button></div><div id="gameArea"><div class="mode-badge" id="modeBadge">Modo detectado</div><div class="turn-indicator" id="turnIndicator">Turno de...</div><div class="game-card"><div class="card-instruction" id="cardInstruction">Cargando...</div><div id="secretContainer"></div><div class="card-consequence" id="cardConsequence">Penitencia...</div></div><button class="btn" id="nextCardBtn">Siguiente Tarjeta</button><button class="btn btn-climax" id="climaxBtn">Pasar al Clímax (Alguien ya está desnudo)</button></div></div><script>let players=[];let currentTurn=0;let cardCount=1;let climaxMode=false;let gameMode="grupo";let usedCards=[];let secretChoices={};let dynamicMatches=[];let totalSecretPromptsShown=0;

const poolNormal={
trio:[
"{P1} debe vendarle los ojos a {P2}. {P3} le dará un beso sorpresa en el cuello o los labios. {P2} tiene que adivinar quién le ha besado.",
"{P1} y {P2} deben unirse para hacerle cosquillas a {P3} en los costados durante 20 segundos. ¡{P3} no puede defenderse!",
"{P1} tiene que susurrarle un secreto picante al oído a {P2}, y luego {P2} debe decidir si se lo cuenta en secreto a {P3} o si prefiere perder una prenda.",
"{P2} se tumba boca arriba. {P1} y {P3} deben usar un dedo cada uno para recorrer simultáneamente sus brazos desde la mano hasta el hombro. {P2} debe decir cuál de los dos tiene el tacto más suave.",
"{P3} tiene el poder de mandar un reto conjunto: {P1} y {P2} deben mirarse fijamente a los ojos a escasos centímetros durante 30 segundos sin reírse.",
"{P1} debe elegir a uno de los otros dos participantes y confesar abiertamente qué es lo que más le atrae de él/ella en este momento.",
"Castigo del Desnudo: Si alguno de los presentes ya está totalmente desnudo, puede ordenar a {P1} y a {P2} que se den un beso de 5 segundos en la zona que él elija."
],
parejas:[
"Reto Cruzado: {P1} debe acercarse a {P2} (que no es su pareja inicial) y susurrarle al oído qué parte del cuerpo le besaría ahora mismo.",
"Sintonía dual: {P1} y {P2} formarán el Equipo A, y los otros dos el Equipo B. El Equipo A tiene 10 segundos para ponerse de acuerdo en una palabra secreta mirándose a los ojos.",
"Juego de roces: {P1} debe usar su rodilla para acariciar lentamente la pierna de {P2} de manera sugerente durante este turno.",
"Confesión cruzada: {P2} debe confesarle a {P1} qué fantasía le genera curiosidad experimentar con alguien de este grupo.",
"Intercambio de miradas: {P1} y {P2} deben sostenerse la mirada de forma fija y seductora durante 20 segundos sin desviar los ojos.",
"Venganza del desnudo: Si alguien ya se quedó sin ropa, tiene derecho a robarle una prenda a {P1} de manera directa para aumentar el desnudamiento."
],
grupo:[
"Votación grupal: A la de tres, todos deben apuntar con el dedo a la persona que consideren que lleva la ropa más provocativa. El más votado se quita una de ellas.",
"Efecto dominó: {P1} debe darle un beso en la mejilla a la persona de su derecha, y esa persona a la siguiente, hasta completar el círculo.",
"Ruleta del tacto: {P1} cierra los ojos. Todos los demás participantes masculinos/femeninos deben pasarle una mano por el brazo. {P1} debe adivinar de quién era cada mano.",
"Masaje en cadena: Todos los participantes se colocan en fila sentados. Cada uno debe darle un masaje de hombros a la persona que tiene delante durante un minuto.",
"El dictador desnudo: Si alguna persona en la habitación ya está completamente desnuda, toma el control de este turno y elige directamente quién se quita la siguiente prenda sin hacer preguntas.",
"Reto de atención: {P1} debe cerrar los ojos y nombrar de memoria el color exacto de la ropa interior o los calcetines de al menos 3 personas del grupo."
]};

const poolClimax={
trio:[
"¡EL VÉRTICE DEL TRÍO! La persona que se desnudó primero se coloca en el centro. Los otros dos participantes se colocan a sus lados, iniciando una sesión de caricias y besos simultáneos a tres bandas.",
"¡MISIONERO CON ASISTENCIA! Dos de los participantes inician la postura del Misionero Clásico en la cama. El tercer participante (priorizando al que ya estaba desnudo) se coloca al lado, controlando el ritmo y acariciando libremente.",
"¡ESTILO PERRO COMPARTIDO! Una persona se coloca a cuatro patas en el centro. La segunda persona se posiciona detrás para marcar el ritmo, mientras el participante restante se coloca frente a ella para fundirse en besos.",
"¡CONEXIÓN LIBRE DE TRES! Habéis alcanzado el equilibrio perfecto del trío. Olvidaos de los turnos, distribuid los roles de forma cómoda y disfrutad del placer compartido sin restricciones."
],
parejas:[
"¡DIVISIÓN DE PAREJAS POR AFINIDAD! El juego os reconduce de forma definitiva basándose en vuestras elecciones. {MATCH_TEXT} Tomad vuestros espacios independientes en la cama.",
"¡ESTILO DOS Y DOS! Cada pareja recién formada inicia la postura del Misionero en su respectivo lado. Está permitido mantener el contacto visual con la otra pareja o compartir caricias libres si estáis cerca.",
"¡RITMO SINCRONIZADO! Ambas parejas adoptan la postura de Estilo Perro V1 en paralelo. Intentad coordinar el ritmo de movimientos de forma visual entre las dos parejas de la habitación.",
"¡CLÍMAX DOBLE LIBRE! El objetivo se ha cumplido: dos parejas independientes disfrutando al mismo tiempo. Continuad libremente a vuestro propio ritmo."
],
grupo:[
"¡INICIO DE LA ORGÍA POR AFINIDAD! Se rompen todas las barreras. El juego detecta que hay atracciones mutuas cruzadas: {MATCH_TEXT}. Los que ya están desnudos lideran el centro del colchón, atrayendo al resto hacia un contacto masivo.",
"¡SATELLITE COMPARTIDO! Se forman pequeños focos de acción en la habitación. Buscad grupos de dos o tres personas cercanas y cambiad de compañero cada vez que apetezca.",
"¡FUSIÓN DE SENTIDOS! El juego libre queda inaugurado para todos. No hay normas, no hay turnos, no hay timidez. Dejáos llevar por el contacto colectivo."
]};

window.onload=function(){for(let i=1;i<=3;i++) addPlayerRow();}
document.getElementById('addPlayerBtn').addEventListener('click', addPlayerRow);

function addPlayerRow(){const container=document.getElementById('playersContainer');const count=container.children.length+1;const row=document.createElement('div');row.className='player-row';row.innerHTML=`<input type="text" class="input-field p-name" placeholder="Jugador/a ${count}"><select class="select-sex p-sex"><option value="H">M ♂️</option><option value="M">F ♀️</option></select>`;container.appendChild(row);}

document.getElementById('startBtn').addEventListener('click',()=>{players=[];const names=document.getElementsByClassName('p-name');const sexes=document.getElementsByClassName('p-sex');for(let i=0;i<names.length;i++){let n=names[i].value.trim();if(n){players.push({id: i, name:n, sex:sexes[i].value});}}if(players.length<3){alert("Para el modo grupal necesitas introducir al menos 3 participantes.");return;}detectMode();document.getElementById('setupSection').style.display='none';document.getElementById('gameArea').style.display='flex';getCard();});

function detectMode(){const hombres=players.filter(p=>p.sex==='H').length;const mujeres=players.filter(p=>p.sex==='M').length;const total=players.length;if(total===3){gameMode="trio";document.getElementById('modeBadge').textContent="Guion: Trío Sincronizado";}else if(total===4 && hombres===2 && mujeres===2){gameMode="parejas";document.getElementById('modeBadge').textContent="Guion: Doble Pareja (2 y 2)";}else{gameMode="grupo";document.getElementById('modeBadge').textContent="Guion: Orgía / Caos Grupal";}}

function getCard(){document.getElementById('secretContainer').innerHTML="";let rawText="";const activePlayer=players[currentTurn];let currentPool=climaxMode?poolClimax[gameMode]:poolNormal[gameMode];if(!climaxMode && !secretChoices.hasOwnProperty(activePlayer.id) && totalSecretPromptsShown < players.length){generateSecretPrompt(activePlayer);return;}if(climaxMode){let idx=cardCount;if(idx>=currentPool.length) idx=currentPool.length-1;rawText=currentPool[idx];}else{if(usedCards.length===currentPool.length) usedCards=[];let idx;do{idx=Math.floor(Math.random()*currentPool.length);}while(usedCards.includes(idx));usedCards.push(idx);rawText=currentPool[idx];}let shuffled=players.filter(p=>p.id!==activePlayer.id).sort(()=>0.5-Math.random());const p1=activePlayer.name;const p2=shuffled[0]?shuffled[0].name:"";const p3=shuffled[1]?shuffled[1].name:"";let finalInstruction=rawText.replace(/{P1}/g,p1).replace(/{P2}/g,p2).replace(/{P3}/g,p3);if(climaxMode){let matchText="¡Libertad total de emparejamiento!";if(dynamicMatches.length>0){matchText="Parejas recomendadas por atracción mutua: "+dynamicMatches.map(m=>`<strong>${m[0]} y ${m[1]}</strong>`).join(" | ");}finalInstruction=finalInstruction.replace(/{MATCH_TEXT}/g,matchText);}document.getElementById('cardInstruction').innerHTML=finalInstruction;document.getElementById('turnIndicator').textContent=`Turno de: ${activePlayer.name}`;const consQ=document.getElementById('cardConsequence');if(climaxMode){consQ.innerHTML=`<strong>MODO CLÍMAX:</strong> El algoritmo ha hablado. Disfrutad de la reconducción sexual por afinidad.`;}else{consQ.innerHTML=`<strong>PENITENCIA:</strong> Si ${activePlayer.name} falla, se quita una prenda. Si ya está desnudo/a, ¡elige a quién penalizar del grupo!`;}}

function generateSecretPrompt(player){totalSecretPromptsShown++;document.getElementById('turnIndicator').textContent=`Turno Especial de: ${player.name}`;document.getElementById('cardInstruction').innerHTML=`🔒 <strong>PREGUNTA SECRETA DE ATRACCIÓN:</strong><br>Dale el teléfono móvil en mano únicamente a <strong>${player.name}</strong>. Los demás no pueden mirar la pantalla.`;const container=document.getElementById('secretContainer');const options=players.filter(p=>p.id!==player.id).map(p=>`<option value="${player.id}-${p.id}">${p.name}</option>`).join("");container.innerHTML=`<div class="secret-area"><label style="font-size:0.95rem;color:#dfbaff;">Si tuvieras que elegir a una persona de esta habitación para tener sexo esta noche en exclusiva, ¿quién sería?</label><select id="secretSelect" class="select-sex" style="width:100%; margin-top:5px;">${options}</select><button class="btn" id="saveSecretBtn" style="background:var(--accent-sub);">Guardar Selección Secreta</button></div>`;document.getElementById('saveSecretBtn').addEventListener('click',()=>{const select=document.getElementById('secretSelect').value;const [fromId, toId]=select.split("-");secretChoices[fromId]=toId;checkMatches();document.getElementById('secretContainer').innerHTML=`<p style="color:#00ff88; font-weight:bold; font-size:1rem; text-align:center;">¡Elección guardada con éxito de forma totalmente invisible! Pasa el móvil.</p>`;setTimeout(()=>{getCard();},2000);});}

function checkMatches(){dynamicMatches=[];let checked=[];for(let fromId in secretChoices){let toId=secretChoices[fromId];if(secretChoices[toId]===fromId && !checked.includes(fromId)){const p1=players.find(p=>p.id==parseInt(fromId)).name;const p2=players.find(p=>p.id==parseInt(toId)).name;dynamicMatches.push([p1,p2]);checked.push(fromId);checked.push(toId);}}}document.getElementById('nextCardBtn').addEventListener('click',()=>{cardCount++;currentTurn=(currentTurn+1)%players.length;if(cardCount>=2&&!climaxMode){document.getElementById('climaxBtn').style.display='block';}getCard();});document.getElementById('climaxBtn').addEventListener('click',()=>{climaxMode=true;document.getElementById('climaxBtn').style.display='none';cardCount=0;getCard();});</script></body></html>
