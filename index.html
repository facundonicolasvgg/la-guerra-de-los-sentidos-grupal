function generateSecretPromptStep2(player){playersPromptedSecret.push(player.id);document.getElementById('cardInstruction').innerHTML=`🔒 <strong>PREGUNTA SECRETA</strong><br><small style='color:#ff7ea0;'>Nadie en la habitación sabrá lo que elegiste.</small>`;const container=document.getElementById('secretContainer');const options=players.filter(p=>p.id!==player.id).map(p=>`<option value="${player.id}-${p.id}">${p.name}</option>`).join("");container.innerHTML=`<div class="secret-area"><label style="font-size:0.95rem;color:#dfbaff;">Si tuvieras que elegir a una persona de esta habitación para terminar teniendo sexo esta noche, ¿quién sería?</label><select id="secretSelect" class="select-sex" style="width:100%; margin-top:5px;">${options}</select><button class="btn" id="saveSecretBtn" style="background:var(--accent);">Confirmar Selección</button></div>`;document.getElementById('saveSecretBtn').addEventListener('click',()=>{const select=document.getElementById('secretSelect').value;const [fromId, toId]=select.split("-");secretChoices[fromId]=toId;checkMatches();container.innerHTML=`<p style="color:#00ff88; font-weight:bold; text-align:center;">Guardado con éxito. Pasa el móvil.</p>`;setTimeout(()=>{getCard();},1200);});}

function checkMatches(){dynamicMatches=[];let checked=[];for(let fromId in secretChoices){let toId=secretChoices[fromId];if(secretChoices[toId]===fromId && !checked.includes(fromId)){const p1=players.find(p=>p.id==parseInt(fromId)).name;const p2=players.find(p=>p.id==parseInt(toId)).name;dynamicMatches.push([p1,p2]);checked.push(fromId);checked.push(toId);}}}document.getElementById('nextCardBtn').addEventListener('click',()=>{cardCount++;currentTurn=(currentTurn+1)%players.length;if(cardCount>=3 && climaxStage===0){document.getElementById('climaxBtn').style.display='block';}getCard();});

document.getElementById('climaxBtn').addEventListener('click',()=>{if(climaxStage===0){climaxStage=1;cardCount=0;document.getElementById('climaxBtn').textContent="Otra persona más se ha quedado sin ropa";getCard();}else if(climaxStage===1){climaxStage=2;cardCount=0;document.getElementById('climaxBtn').style.display='none';getCard();}});</script></body></html>
