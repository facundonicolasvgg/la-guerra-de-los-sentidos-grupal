<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>La Guerra de los Sentidos - Fiesta Pro</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{--bg:#0b0612;--card-bg:#160f24;--accent:#ff2a5f;--accent-sub:#9d1df2;--text:#ffffff;--text-muted:#a59ba3;}body{margin:0;padding:20px;background:radial-gradient(circle at top, #1a0b2e, var(--bg));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box;}header{text-align:center;margin-bottom:15px;}h1{margin:0;font-size:1.8rem;background:linear-gradient(45deg,var(--accent),var(--accent-sub));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}header p{margin:5px 0 0 0;color:var(--text-muted);font-size:0.85rem;font-style:italic;}.container{width:100%;max-width:440px;display:flex;flex-direction:column;gap:15px;}h3{margin:0 0 10px 0;}.setup-section{background:var(--card-bg);padding:20px;border-radius:20px;border:1px solid #2d1b4e;box-shadow:0 10px 30px rgba(0,0,0,0.5);}.player-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}.input-field{padding:12px;border-radius:10px;border:1px solid #443266;background:#201435;color:white;font-size:1rem;flex:1;box-sizing:border-box;}.select-sex{padding:12px;border-radius:10px;border:1px solid #443266;background:#201435;color:white;font-size:1rem;cursor:pointer;}.btn{padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(255,42,95,0.3);width:100%;box-sizing:border-box;margin-top:5px;}.btn-secondary{background:#3b2366;box-shadow:none;margin-bottom:10px;}.btn-climax{background:linear-gradient(45deg, #cc0000, #660022);border:1px solid #ff0055;margin-top:10px;display:none;}#gameArea{display:none;flex-direction:column;gap:15px;width:100%;}.turn-indicator{text-align:center;font-size:1.1rem;font-weight:bold;color:#ffde59;margin-bottom:5px;}.mode-badge{text-align:center;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;background:rgba(157,29,242,0.3);padding:4px 10px;border-radius:20px;color:#dfbaff;align-self:center;margin-bottom:5px;border:1px solid rgba(157,29,242,0.5);}.game-card{width:100%;background:#201633;border:2px solid var(--accent);border-radius:20px;padding:25px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:0 8px 25px rgba(0,0,0,0.6);}.card-instruction{font-size:1.15rem;line-height:1.5;color:#e2d9f3;margin-bottom:15px;font-weight:500;}.card-consequence{background:rgba(255,42,95,0.1);border:1px dashed var(--accent);padding:12px;border-radius:8px;font-size:0.9rem;color:#ff7ea0;margin-top:10px;line-height:1.4;}.secret-area{background:#110a1c;border:1px solid var(--accent-sub);border-radius:12px;padding:15px;margin-top:10px;display:flex;flex-direction:column;gap:10px;}</style></head><body><header><h1>La Guerra de los Sentidos</h1><p>Edición Inteligente con Alcohol</p></header><div class="container"><div class="setup-section" id="setupSection"><h3>Participantes</h3><div id="playersContainer"></div><button class="btn btn-secondary" id="addPlayerBtn">+ Añadir Jugador/a</button><button class="btn" id="startBtn">Comenzar Juego</button></div><div id="gameArea"><div class="mode-badge" id="modeBadge">Modo detectado</div><div class="turn-indicator" id="turnIndicator">Turno de...</div><div class="game-card"><div class="card-instruction" id="cardInstruction">Cargando...</div><div id="secretContainer"></div><div class="card-consequence" id="cardConsequence">Penitencia...</div></div><button class="btn" id="nextCardBtn">Siguiente Tarjeta</button><button class="btn btn-climax" id="climaxBtn">Alguien se ha quedado desnudo</button></div></div><script>let players=[];let currentTurn=0;let cardCount=1;let climaxStage=0;let gameMode="grupo";let secretChoices={};let dynamicMatches=[];let playersPromptedSecret=[];

// Base de datos de tarjetas mutables (se van eliminando para que NUNCA se repitan)
let poolNormal={
suave:[
"{P1} debe mirar fijamente a los ojos de {P2} durante 30 segundos. Quien parpadee o se ría primero, se toma un buen trago de su copa.",
"Trago de calentamiento: Todos los hombres de la habitación beben un trago largo, luego todas las mujeres hacen lo mismo brindando por la noche.",
"{P1} debe darle un masaje de un minuto en el cuello a {P2}. Si {P2} emite algún sonido, ambos beben un trago.",
"{P2} cierra los ojos. {P1} va a rozar sus labios muy cerca de su oreja sin tocarla y soplará suavemente. {P2} bebe si se estremece.",
"Cultura chupito: {P1} propone un tema (ej: posiciones sexuales). Todos van diciendo una palabra en ronda. El primero que repita o tarde en responder, bebe un chupito."
],
medio:[
"{P1} debe vendarle los ojos a {P2}. {P3} le dará un beso suave en el cuello. {P2} debe adivinar quién fue. Si acierta, {P3} bebe 2 tragos; si falla, bebe {P2}.",
"Trago Confesión: {P1} tiene que susurrarle al oído a {P2} qué parte de su cuerpo le da más curiosidad. Si no quiere que el grupo lo oiga, {P1} se toma un chupito entero.",
"Yo nunca masivo: {P1} dice un 'Yo nunca' picante. Todos los que lo hayan hecho beben un trago generoso de su copa.",
"{P1} y {P2} deben beber un trago de la misma copa simultáneamente entrelazando sus brazos (estilo fondo blanco corto).",
"Beso o Trago: {P1} debe darle un beso de 5 segundos en la mejilla o el cuello a {P2}. Si alguno se niega, ambos se toman un chupito obligatorio."
],
alto:[
"El trago del desnudamiento: {P1} elige entre quitarse una prenda de ropa o tomarse dos chupitos seguidos de golpe.",
"{P1} tiene que confesar abiertamente cuál es su mayor fantasía en la cama. El que se ponga rojo en el grupo, ¡bebe!",
"{P2} se tumba boca arriba. {P1} debe beber un trago del ombligo o del pecho de {P2} (si tiene ropa, por encima de la tela de forma sugerente).",
"Dados invisibles: {P1} y {P2} se toman un trago largo y deben sostener una mirada puramente erótica a escasos centímetros. El primero que se aparte, pierde una prenda.",
"Reto cruzado alcohólico: {P1} sirve un trago a su gusto y debe dárselo de beber directamente en la boca a {P2} mientras le acaricia el pelo."
]};

let poolCaliente={
trio:[
"El juego del hielo: {P1} debe pasar un hielo con la boca a {P2}, y este a {P3}. El que deje caer el hielo o use las manos se quita una prenda y bebe.",
"{P1} debe morder suavemente el cuello de {P2} mientras {P3} le derrama unas gotas de bebida en el abdomen y las limpia con los labios.",
"Chupito triple: Los tres integrantes del trío deben juntar sus vasos y beber un chupito entero a la vez antes de que {P1} elija quién se quita una prenda.",
"{P2} se coloca en medio de {P1} y {P3}. Ambos deben besar y acariciar sus brazos y torso mientras {P2} disfruta de su copa de espaldas."
],
parejas:[
"Trago en el regazo: {P1} debe sentarse a horcajadas en el regazo de {P2}. En esa postura, deben compartir una copa entera sin usar las manos.",
"Intercambio líquido: {P2} toma un sorbo de alcohol y debe pasárselo mediante un beso directo en la boca a {P1}.",
"{P1} va a elegir a {P2} para un baile cuerpo a cuerpo pegados durante un minuto. Los otros dos actúan como jueces y beben si les da envidia.",
"Doble fondo blanco: Las dos parejas de la habitación brindan mirándose a los ojos y se toman un trago largo para sincronizar el ritmo."
],
grupo:[
"Ruleta del Chupito Grupal: El que se desnudó primero llena un chupito y lo pone en el centro. Hace girar una botella. Al que apunte, se lo toma y se quita una prenda.",
"Cuerpo de barra: {P1} se tumba y el grupo decide sobre qué parte de su piel limpia se sirve un chupito para que otra persona lo tome directamente.",
"Votación de alcohol y ropa: Todos apuntan a la de tres a quien consideren que está más sobrio. El elegido debe beber dos tragos y deshacerse de una prenda.",
"Fondo blanco colectivo: Todos los que aún tengan prendas puestas deben terminar su copa actual de golpe para igualar la temperatura de los desnudados."
]};

let poolSexual={
trio:[
"¡EL VÉRTICE DEL TRÍO! La persona del sexo único se coloca en el centro. Los otros dos a sus lados para caricias y besos. Tomad un último sorbo de vuestras copas y dejadlas.",
"¡MISIONERO CON ASISTENCIA! Dos participantes inician el Misionero Clásico en la cama. El tercero se coloca al lado guiando el ritmo y acariciando libremente.",
"¡ESTILO PERRO COMPARTIDO! Una persona a cuatro patas en el centro. La segunda se posiciona detrás marcando el ritmo, mientras la tercera se funde en besos delante.",
"¡CONEXIÓN LIBRE DE TRES! Habéis alcanzado el clímax absoluto. Olvidaos de las copas, distribuid los roles de forma cómoda y disfrutad."
],
parejas:[
"¡DIVISIÓN DE PAREJAS POR AFINIDAD! El juego os reconduce de forma definitiva. {MATCH_TEXT} Tomad vuestros espacios independientes en la cama y que empiece la acción.",
"¡ESTILO DOS Y DOS! Cada pareja recién formada inicia la postura del Misionero en su lado de la cama de forma paralela.",
"¡RITMO SINCRONIZADO! Ambas parejas adoptan la postura de Estilo Perro V1. Intentad coordinar los movimientos visualmente entre ambas parejas.",
"¡CLÍMAX DOBLE LIBRE! El objetivo se ha cumplido: dos parejas independientes disfrutando al mismo tiempo. Continuad libremente a vuestro ritmo."
],
grupo:[
"¡INICIO DE LA ORGÍA POR AFINIDAD! Se rompen las barreras. El juego detecta estas atracciones mutuas: {MATCH_TEXT}. Agrupaos en el centro para contacto libre y salvaje.",
"¡SATELLITE COMPARTIDO! Se forman focos de acción erótica en la habitación. Buscad grupos de dos o tres personas cercanas y cambiad de compañero cuando os apetezca.",
"¡FUSIÓN DE SENTIDOS! El juego libre queda inaugurado para todo el grupo. Dejáos llevar por el contacto colectivo sin normas ni turnos."
]};

window.onload=function(){for(let i=1;i<=3;i++) addPlayerRow();}
document.getElementById('addPlayerBtn').addEventListener('click', addPlayerRow);

function addPlayerRow(){const container=document.getElementById('playersContainer');const count=container.children.length+1;const row=document.createElement('div');row.className='player-row';row.innerHTML=`<input type="text" class="input-field p-name" placeholder="Jugador/a ${count}"><select class="select-sex p-sex"><option value="H">M ♂️</option><option value="M">F ♀️</option></select>`;container.appendChild(row);}

document.getElementById('startBtn').addEventListener('click',()=>{players=[];const names=document.getElementsByClassName('p-name');const sexes=document.getElementsByClassName('p-sex');for(let i=0;i<names.length;i++){let n=names[i].value.trim();if(n){players.push({id: i, name:n, sex:sexes[i].value});}}if(players.length<3){alert("Introduce al menos 3 participantes.");return;}detectMode();document.getElementById('setupSection').style.display='none';document.getElementById('gameArea').style.display='flex';getCard();});

function detectMode(){const hombres=players.filter(p=>p.sex==='H').length;const mujeres=players.filter(p=>p.sex==='M').length;const total=players.length;if(total===3){gameMode="trio";document.getElementById('modeBadge').textContent="Guion: Trío Sincronizado";}else if(total===4 && hombres===2 && mujeres===2){gameMode="parejas";document.getElementById('modeBadge').textContent="Guion: Doble Pareja (2 y 2)";}else{gameMode="grupo";document.getElementById('modeBadge').textContent="Guion: Orgía / Caos Grupal";}}

function getCard(){document.getElementById('secretContainer').innerHTML="";document.getElementById('cardConsequence').style.display="block";let rawText="";const activePlayer=players[currentTurn];if(climaxStage===0 && cardCount > 2 && !playersPromptedSecret.includes(activePlayer.id) && playersPromptedSecret.length < players.length){generateSecretPromptStep1(activePlayer);return;}if(climaxStage===0){let poolTier=poolNormal.suave;if(cardCount>5) poolTier=poolNormal.medio;if(cardCount>10) poolTier=poolNormal.alto;if(poolTier.length===0) poolTier=poolNormal.alto; // Respaldo por si se acabanlet idx=Math.floor(Math.random()*poolTier.length);rawText=poolTier[idx];poolTier.splice(idx,1); // Eliminar tarjeta usada para que NUNCA se repita}else if(climaxStage===1){let poolTier=poolCaliente[gameMode];if(poolTier.length===0) poolTier=["¡La tensión corta el aire! Tomad un chupito general, acariciaos libremente y avanzad cuando otra persona esté totalmente desnuda."];let idx=Math.floor(Math.random()*poolTier.length);rawText=poolTier[idx];if(poolTier.length>1) poolTier.splice(idx,1); // Eliminar usada}else{let idx=cardCount;let poolTier=poolSexual[gameMode];if(idx>=poolTier.length) idx=poolTier.length-1;rawText=poolTier[idx];}let shuffled=players.filter(p=>p.id!==activePlayer.id).sort(()=>0.5-Math.random());const p1=activePlayer.name;const p2=shuffled[0]?shuffled[0].name:"";const p3=shuffled[1]?shuffled[1].name:"";let finalInstruction=rawText.replace(/{P1}/g,p1).replace(/{P2}/g,p2).replace(/{P3}/g,p3);if(climaxStage===2){let matchText="¡Libertad total de emparejamiento!";if(dynamicMatches.length>0){matchText=dynamicMatches.map(m=>`<strong>${m[0]} y ${m[1]}</strong>`).join(" | ");}finalInstruction=finalInstruction.replace(/{MATCH_TEXT}/g,matchText);}document.getElementById('cardInstruction').innerHTML=finalInstruction;document.getElementById('turnIndicator').textContent=`Turno de: ${activePlayer.name}`;const consQ=document.getElementById('cardConsequence');if(climaxStage===0){consQ.innerHTML=`<strong>PENITENCIA:</strong> Si ${activePlayer.name} falla el reto, se quita una prenda de ropa o bebe un chupito castigo.`;}else if(climaxStage===1){consQ.innerHTML=`<strong>PENITENCIA POTENCIADA:</strong> Si se falla, se quitan DOS prendas o fondo blanco de tu copa.`;}else{consQ.innerHTML=`<strong>FASE SEXUAL:</strong> El juego se detiene. Disfrutad de la interacción libre en el colchón.`;}}

function generateSecretPromptStep1(player){document.getElementById('turnIndicator').textContent=`Turno Especial`;document.getElementById('cardConsequence').style.display="none";document.getElementById('cardInstruction').innerHTML=`<div style='text-align:center; padding:10px;'>🔒 <strong>SISTEMA DE ASIGNACIÓN SECRETA</strong><br><br><span style='font-size:1.3rem; color:#ffde59;'>Pasa el teléfono móvil a: <br><strong>${player.name}</strong></span><br><br><small style='color:var(--text-muted);'>Los demás jugadores deben mirar a otro lado. Mantén la discreción.</small></div>`;const container=document.getElementById('secretContainer');container.innerHTML=`<button class="btn" id="revealSecretBtn" style="background:var(--accent-sub); margin-top:15px;">Soy ${player.name}, abrir pregunta</button>`;document.getElementById('revealSecretBtn').addEventListener('click',()=>{generateSecretPromptStep2(player);});}

function generateSecretPromptStep2(player){playersPromptedSecret.push(player.id);document.getElementById('cardInstruction').innerHTML=`🔒 <strong>PREGUNTA SECRETA</strong><br><small style='color:#ff7ea0;'>Nadie en la habitación sabrá lo que elegiste.</small>`;const container=document.getElementById('secretContainer');const options=players.filter(p=>p.id!==player.id).map(p=>`<option value="${player.id}-${p.id}">${p.name}</option>`).join("");container.innerHTML=`<div class="secret-area"><label style="font-size:0.95rem;color:#dfbaff;">Si tuvieras que elegir a una persona de esta habitación para terminar teniendo sexo esta noche, ¿quién sería?</label><select id="secretSelect" class="select-sex" style="width:100%; margin-top:5px;">${options}</select><button class="btn" id="saveSecretBtn" style="background:var(--accent);">Confirmar Selección</button></div>`;document.getElementById('saveSecretBtn').addEventListener('click',()=>{const select=document.getElementById('secretSelect').value;const [fromId, toId]=select.split("-");secretChoices[fromId]=toId;checkMatches();container.innerHTML=`<p style="color:#00ff88; font-weight:bold; text-align:center;">Guardado con éxito. Pasa el móvil.</p>`;setTimeout(()=>{getCard();},1200);});}

function checkMatches(){dynamicMatches=[];let checked=[];for(let fromId in secretChoices){let toId=secretChoices[fromId];if(secretChoices[toId]===fromId && !checked.includes(fromId)){const p1=players.find(p=>p.id==parseInt(fromId)).name;const p2=players.find(p=>p.id==parseInt(toId)).name;dynamicMatches.push([p1,p2]);checked.push(fromId);checked.push(toId);}}}document.getElementById('nextCardBtn').addEventListener('click',()=>{cardCount++;currentTurn=(currentTurn+1)%players.length;if(cardCount>=3 && climaxStage===0){document.getElementById('climaxBtn').style.display='block';}getCard();});

document.getElementById('climaxBtn').addEventListener('click',()=>{if(climaxStage===0){climaxStage=1;cardCount=0;document.getElementById('modeBadge').textContent="Fase: Crescendo Máximo 🔥";document.getElementById('climaxBtn').textContent="Otra persona más se ha quedado desnuda";document.getElementById('climaxBtn').style.background="linear-gradient(45deg, #cc0000, #110000)";getCard();}else if(climaxStage===1){climaxStage=2;cardCount=0;document.getElementById('modeBadge').textContent="Fase: Acción Sexual 🔞";document.getElementById('climaxBtn').style.display='none';getCard();}});</script></body></html>
